name: UADS source quality
on:
  pull_request:
    branches: [testing, beta, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uads-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/dashboard/
            /packages/expo/
            /docs/
            /config/
            /scripts/validate-uads.py
            /uads.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/validate-uads.py
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
      - run: npm audit --audit-level=high
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /services/api/
            /packages/protected-storage/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test ../../packages/protected-storage/crypto.test.mjs
      - run: npm audit --audit-level=high

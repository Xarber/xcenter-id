<div class="sidebar-container">
    <div class="sidebar">
        <button onclick="document.querySelector('.sidebar-container .content .sidebar-back-button').click();document.querySelector('.sidebar-container .content .sidebar-section#sbs-' + this.id.replace('sbsb-', '')).classList.add('selected');" id="sbsb-section">Section</button>
    </div>
    <div class="content">
        <button class="sidebar-back-button" onclick="this.parentNode.querySelector('.sidebar-section.selected').classList.remove('selected');">&lt;-</button>
        <div class="sidebar-section sidebar-section-default center-content-dom">
            <h1>Select a section to begin!</h1>
            <p>Use the menu at the left to select a section.</p>
        </div>
        <div id="sbs-section" class="sidebar-section">
            <h1>Section</h1>
            <p>This is a section</p>
        </div>
    </div>
</div>

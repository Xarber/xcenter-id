<!DOCTYPE html>
<html lang="en">
<head>
    <?nodejs echo(loadFile('./HTML/assets/modules/head.html', 'utf8')+""); ?>
    <title>Auth System</title>
</head>
<body class="fullscreen-page">
    <?nodejs echo(loadFile('./HTML/assets/modules/nav.html', 'utf8')+""); ?>
    <div class="navholder"></div>
    <div class="container semi-fullscreen">
        <h1>This is a test app</h1>
        <div class="dark container">
            <h3>Last Action Output:</h3>
            <p id="app-output">...</p>
        </div>
        <div class="container">
            <h3>Icons</h3>
            <input id="icons-upload" type="file" onchange="const imgPath = document.getElementById('icons-upload').files[0];const reader = new FileReader();reader.addEventListener('load', function () {document.querySelector('#icons-upload-text').value = reader.result;document.getElementById('icons-upload').value = '';}, false);if (imgPath) {reader.readAsDataURL(imgPath);}" accept=".png, .jpg" class="hided" alt="">
            <input type="text" id="icons-upload-text" class="hided" value="">
            <select name="icons-type" id="icons-type" title="Icon Type">
                <option value="not-selected" style="color: black;" selected disabled>Icon Type</option>
                <option value="app" style="color: black;">App</option>
                <option value="user" style="color: black;">User</option>
            </select>
            <br>
            <button onclick="document.querySelector('#icons-upload').click();">Upload image (Don't upload to get)</button>
            <button onclick="var img = document.querySelector('#icons-upload-text').value;icons((img.length > 0), (document.querySelector('#icons-type').value === 'user'), img);document.querySelector('#icons-upload-text').value = '';">Execute</button>
        </div>
        <input type="text" id="target-acc" placeholder="Target Account (empty = self)" style="width: calc(100% - 25px)">
        <input type="text" id="target-app" placeholder="Target App ID (empty = self)" style="width: calc(100% - 25px)">
        <input type="text" id="enckey" placeholder="Custom Encryption Key (or empty for server one)" style="width: calc(100% - 25px)">
        <div class="container">
            <h3>Link/Update</h3>
            <p>Connect the app to the account/Update it's permissions</p>
            <input type="text" id="hasPermissions" placeholder="Available permissions in this app (OBJECT)" value='{"root": [""]}'>
            <input type="text" id="availablePermissions" placeholder="Permissions over other apps (OBJECT)" value='{}'>
            <button onclick="link(undefined, JSON.parse(document.querySelector('#hasPermissions').value), JSON.parse(document.querySelector('#availablePermissions').value));">Link</button>
        </div>
        <div class="container">
            <h3>Write</h3>
            <input type="text" id="write-name" placeholder="File Name" value="">
            <input type="text" id="write-content" placeholder="File Content" value="">
            <button onclick="writedata(document.querySelector('#write-name').value, document.querySelector('#write-content').value)">Write</button>
        </div>
        <div class="container">
            <h3>Read</h3>
            <input type="text" id="read-name" placeholder="File Name">
            <button onclick="read(document.querySelector('#read-name').value)">Read</button>
        </div>
        <div class="container">
            <h3>List Directory</h3>
            <input type="text" id="list-name" placeholder="Directory Name">
            <button onclick="listDirectory(document.querySelector('#list-name').value)">List</button>
        </div>
        <div class="container">
            <h3>Move</h3>
            <input type="text" id="move-source" placeholder="Source File">
            <input type="text" id="move-destination" placeholder="Destination">
            <button onclick="move(document.querySelector('#move-source').value, document.querySelector('#move-destination').value)">Move</button>
        </div>
        <div class="container">
            <h3>Delete</h3>
            <p class="notice">Remember! The target in this action will ALWAYS be the self app! </p>
            <input type="text" id="remove-name" placeholder="File Name">
            <button onclick="remove(document.querySelector('#remove-name').value)">Delete</button>
        </div>
    </div>
    <?nodejs echo(loadFile('./HTML/assets/modules/footer.html', 'utf8')+""); ?>
    <script>
        var vars = {};
        var parts = decodeURI(window.location.href).replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m,key,value) {
            vars[key] = value.replaceAll('%22', '"').replaceAll('%2C', ',').replaceAll('%3A', ':').replaceAll('%7B', '{').replaceAll('%5B', '[').replaceAll('%5D', ']').replaceAll('%7D', '}').replaceAll('%2F', '/').replaceAll('%3D', '=').replaceAll('%3B', ';').replaceAll('%26', '&').replaceAll('%3F', '?').replaceAll('+', ' ');
        });
        localStorage['SavedEncryptionKey'] ??= "";
        document.querySelector('#enckey').value = localStorage['SavedEncryptionKey'].length > 0 ? localStorage['SavedEncryptionKey'] : "";
        function writedata(name, content) {
            localStorage['SavedEncryptionKey'] = document.querySelector('#enckey').value;
            if (document.querySelector('#target-acc').value.length > 0) name = `%EXECTOACC:${document.querySelector('#target-acc').value}%/${name}`;
            if (document.querySelector('#target-app').value.length > 0 && document.querySelector('#target-acc').value.length < 1) name = `%EXECTOAPP:${document.querySelector('#target-app').value}%/${name}`;
            fetch('/api/data/write', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: {
                    name: "Test App",
                    author: "Xarber",
                    id: sessionStorage['defaultAppID'],
                    token: apptoken
                },
                data: {
                    name: name,
                    content: content
                }
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerText = r;
            });
        }
        function read(name) {
            localStorage['SavedEncryptionKey'] = document.querySelector('#enckey').value;
            if (document.querySelector('#target-acc').value.length > 0) name = `%EXECTOACC:${document.querySelector('#target-acc').value}%/${name}`;
            if (document.querySelector('#target-app').value.length > 0 && document.querySelector('#target-acc').value.length < 1) name = `%EXECTOAPP:${document.querySelector('#target-app').value}%/${name}`;
            fetch('/api/data/read', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: {
                    name: "Test App",
                    author: "Xarber",
                    id: sessionStorage['defaultAppID'],
                    token: apptoken
                },
                data: {
                    name: name
                }
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerText = r;
            });
        }
        function icons(upload, user, content) {
            localStorage['SavedEncryptionKey'] = document.querySelector('#enckey').value;
            if (!upload) fetch('/api/misc/geticon', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: user ? undefined : sessionStorage['defaultAppID']
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerHTML = "<img src='"+r+"' alt='LoadedImage' /><br>"+r;
            });
            if (!!upload) fetch('/api/data/addicon', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: user ? undefined : {
                    name: "Test App",
                    author: "Xarber",
                    id: sessionStorage['defaultAppID'],
                    token: apptoken
                },
                data: {
                    content: content
                }
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerText = r;
            });
        }
        function listDirectory(name) {
            localStorage['SavedEncryptionKey'] = document.querySelector('#enckey').value;
            if (document.querySelector('#target-app').value.length > 0) name = `%EXECTOAPP:${document.querySelector('#target-app').value}%/${name}`;
            fetch('/api/data/list', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: {
                    name: "Test App",
                    author: "Xarber",
                    id: sessionStorage['defaultAppID'],
                    token: apptoken
                },
                data: {
                    name: name
                }
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerText = r.replaceAll("\n", "<br>");
            });
        }
        function move(source, destination) {
            localStorage['SavedEncryptionKey'] = document.querySelector('#enckey').value;
            if (document.querySelector('#target-app').value.length > 0) source = `%EXECTOAPP:${document.querySelector('#target-app').value}%/${source}`;
            fetch('/api/data/move', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: {
                    name: "Test App",
                    author: "Xarber",
                    id: sessionStorage['defaultAppID'],
                    token: apptoken
                },
                data: {
                    name: source,
                    content: destination
                }
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerText = r;
            });
        }
        function remove(name) {
            localStorage['SavedEncryptionKey'] = document.querySelector('#enckey').value;
            fetch('/api/data/remove', {method: 'POST', body: JSON.stringify({
                token: r,
                enckey: (document.querySelector('#enckey').value.length > 0) ? document.querySelector('#enckey').value : false,
                app: {
                    name: "Test App",
                    author: "Xarber",
                    id: sessionStorage['defaultAppID'],
                    token: apptoken
                },
                data: {
                    name: name
                }
            })}).then(r=>r.text()).then(r=>{
                document.querySelector('#app-output').innerText = r;
            });
        }

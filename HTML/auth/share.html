<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System - Share Data</title>
    <link rel="stylesheet" href="../assets/css/default.css">
</head>
<body>
    <div class="fullscreen">
        <div class="background" style="background-image: url('../assets/media/pxfuel-auth.jpg');"></div>
        <form class="center blur dark popup auth share link" method="post" onkeydown="if (event.keyCode === 13) return false;" action="/api/share">
            <button type="button" class="backButton" onclick="window.history.back();"><img src="/assets/media/backarrow-hd-dark.png" alt=""></button>
            <h1>Share</h1>
            <p id="link-app-text">Share your data with another user</p>
            <div class="inline-elements" class="linkicons">
                <div class="dummy"><img class="authusericon" src="../assets/media/SampleUserIcon.png" alt=""></div>
                <svg class="authlinkdots" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"/></svg>
                <div class="dummy"><img class="authusericon" src="../assets/media/SampleUserIcon.png" alt=""></div>
            </div>
            <input type="text" required autocomplete="username" name="shareuser" id="shareuser" value="" placeholder="User">
            <div class="userperms">
                <h4 style="text-align: center;">Permissions</h4>
                <p style="text-align: center;"><span class="textbox">Click: Read/Write</span> <span class="textbox">Right Click: Remove</span></p>
                <div class="container round scroll small">
                    <select class="input" style="width: calc(100% - 10px);" id="sharepermsApps" onchange="refreshPerms(this, this.parentNode.querySelector('div').querySelector('select'))"></select>
                    <div class="inline-elements">
                        <select class="input" id="sharepermsPerms" onchange="this.parentNode.querySelector('button').removeAttribute('disabled')">
                            <option value="">No Perms!</option>
                        </select>
                        <button disabled type="button" onclick="this.parentNode.parentNode.innerHTML += `<div app='${this.parentNode.parentNode.querySelectorAll('select')[0].value}' perm='${this.parentNode.querySelectorAll('select')[0].value}' oncontextmenu='this.remove();return false' onclick='this.classList.toggle(\`warn\`);' class='input info-element toShareDataPermission'><h4>${this.parentNode.parentNode.querySelectorAll('select')[0].querySelectorAll('option[value=' + this.parentNode.parentNode.querySelectorAll('select')[0].value + ']')[0].innerHTML}</h4><p>${this.parentNode.querySelectorAll('select')[0].value}</p></div>`;" class="input">+</button>
                    </div>
                </div>
            </div>
            <div class="hided">
                <input type="text" name="token" id="share-token" value="">
                <input type="text" name="redirect" id="redirect-link">
            </div>
            <button type="submit" id="submit" class="hided" style="display: none;"></button>
            <button type="button" class="submit" onclick="sendShareRequest(this.parentNode);" disabled>Confirm</button>
        </form>
    </div>
    <script>
        var vars = {};
        var parts = decodeURI(window.location.href).replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m,key,value) {
            vars[key] = value.replaceAll('%22', '"').replaceAll('%2C', ',').replaceAll('%3A', ':').replaceAll('%7B', '{').replaceAll('%5B', '[').replaceAll('%5D', ']').replaceAll('%7D', '}').replaceAll('%2F', '/').replaceAll('%3D', '=').replaceAll('%3B', ';').replaceAll('%26', '&').replaceAll('%3F', '?').replaceAll('+', ' ');
        });
        window.history.replaceState({}, "", location.pathname);
        document.querySelectorAll('p.center-text a').forEach(e=>{e.href = e.href + window.location.search});
        if (vars["redirect"]) {
            document.querySelector('#redirect-link').setAttribute('value', vars["redirect"])
        } else {
            //window.history.back();
        }
        async function busyWait(test) {
            const delayMs = 500;
            while(!test()) await new Promise(resolve => setTimeout(resolve, delayMs));
        }
        function sendShareRequest(form) {
            document.querySelectorAll('form .toShareDataPermission').forEach(e=>{
                var i = document.createElement('input');
                i.classList.add('hided');
                i.setAttribute('name', 'shareapp-permission/r'+(e.classList.contains('warn') ? "w/" : "/")+e.getAttribute('app'));
                i.setAttribute('value', e.getAttribute('perm'));
                form.appendChild(i);
            });
            form.querySelector('button#submit[type=submit]').click();
        }
        async function awaitLogin(){
            var win1 = window.open("/auth/signin?ra=true", '_blank', `location=yes,height=570,width=520,scrollbars=yes,status=yes,left=${((window.innerWidth ?? document.documentElement.clientWidth ?? screen.width) - 520) / 2 / ((window.innerWidth ?? document.documentElement.clientWidth ?? screen.width) / window.screen.availWidth) + (window.screenLeft ?? window.screenX)},top=${((window.innerHeight ?? document.documentElement.clientHeight ?? screen.height) - 570) / 2 / ((window.innerWidth ?? document.documentElement.clientWidth ?? screen.width) / window.screen.availWidth) + (window.screenTop ?? window.screenY)}`);
            var win = !win1 ? window.open("/auth/signin?ra=true") : win1;
            if (!win) {
                return false;
            }
            var tok = undefined;
            await busyWait(() => win.closed);
            if (window.accesstoken) {
                tok = window.accesstoken;
                delete window.accesstoken;
            }
            return tok;
        };
        function refreshPerms(e, e2) {
            if (window.appPerms && window.appPerms[e.value]) {
                e2.parentNode.querySelector('button').removeAttribute('disabled');
                if (Object.keys(window.appPerms[e.value]).length > 0) e2.innerHTML = "";
                if (Object.keys(window.appPerms[e.value]).length < 1) {e2.innerHTML = `<option value="">No Perms!</option>`;e2.parentNode.querySelector('button').setAttribute('disabled', '')}
                for (var p in window.appPerms[e.value]) {
                    e2.innerHTML += `<option value="${p}">${p}</option>`;
                }
            }
        }
        (async()=>{
            var token = await awaitLogin();
            while(!token) {
                if (token === false && !window.confirm("Please allow popups to log in!")) {window.close();window.history.back();break;}
                else if (!token && token !== false && !window.confirm("You need to log in to share your data!")) {window.close();window.history.back();break;}
                else token = await awaitLogin();
            }
            document.querySelector('input#share-token').setAttribute('value', token);
            if (!!window.opener) document.querySelector('.backButton').classList.add('hided');
            fetch('/api/security/apps', {method: 'POST', body: JSON.stringify({
                token: token
            })}).then(r=>r.text()).then(async r=>{
                try {
                    r = JSON.parse(r);
                    var perms = {};
                    var permNames = {};
                    for (var a of r) {perms[a.id] = a.availablePerms;permNames[a.id] = a.name;}
                    window.appPerms = perms;
                    for (var p in perms) {
                        document.querySelector('select#sharepermsApps').innerHTML += `<option value="${p}">${permNames[p]}</option>`;
                    }
                    refreshPerms(document.querySelector('select#sharepermsApps'), document.querySelector('select#sharepermsPerms'));
                } catch(e){
                    if (e.toString().indexOf('ERROR') != -1) {
                        alert("An error occurred! Try signing in again!");
                        location.reload();
                    }
                }
            });
            fetch('/api/misc/geticon', {method: 'POST', body: JSON.stringify({
                token: token
            })}).then(r=>r.text()).then(r=>{
                if (r.indexOf('ERROR:') != 0) {
                    var img = document.querySelector('img.authusericon');
                    img.setAttribute('onerror', 'this.src = "'+img.src+'"');
                    img.src = r;
                }
            });
            document.querySelector('button.submit').removeAttribute('disabled');
        })();
    </script>
    <?nodejs echo(loadFile('./HTML/assets/modules/common.html', 'utf8')+""); ?>
</body>
</html>

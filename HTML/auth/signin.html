<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth System - Sign In</title>
    <link rel="stylesheet" href="../assets/css/default.css">
</head>
<body>
    <div class="fullscreen">
        <div class="background" style="background-image: url('../assets/media/pxfuel-auth.jpg');"></div>
        <form class="center blur dark popup auth sections" method="post" onkeydown="if (event.keyCode === 13) return false;" onsubmit="return false" action="/api/signin">
            <div>
                <button type="button" class="backButton" onclick="window.history.back();"><img src="/assets/media/backarrow-hd-dark.png" alt=""></button>
                <h1>Sign In</h1>
                <p>Log into your account</p>
                <input type="text" name="redirect" id="redirect-link" value="" class="hided">
                <input type="text" name="accusrname" required autocomplete="username" class="dark" placeholder="Username/email">
                <input type="password" name="accpwd" required autocomplete="current-password" class="dark" placeholder="Password">
                <button type="button" class="submit" onclick="this.parentNode.parentNode.removeAttribute('onsubmit');checkOTP()">Sign In</button>
                <p class="center-text a-options"><a href="/auth/recover">Recover account</a><a href="/auth/signup">Sign up</a></p>
            </div>
            <div class="hided">
                <button type="button" class="backButton" onclick="window.history.back();"><img src="/assets/media/backarrow-hd-dark.png" alt=""></button>
                <h1>Sign In</h1>
                <p>2FA is enabled. Enter the OTP code from your App.</p>
                <input type="text" name="otpcode" autocomplete="one-time-code" class="dark" placeholder="OTP Code">
                <button type="submit" onclick="window.submitted = true;">Sign In</button>
                <p class="center-text a-options"><a href="/auth/recover">Recover account</a><a href="/auth/signup">Sign up</a></p>
            </div>
        </form>
    </div>
    <script>
        const vars = {};
        var parts = decodeURI(window.location.href).replace(/[?&]+([^=&]+)=([^&]*)/gi, function(m,key,value) {
            vars[key] = value.replaceAll('%22', '"').replaceAll('%2C', ',').replaceAll('%3A', ':').replaceAll('%7B', '{').replaceAll('%5B', '[').replaceAll('%5D', ']').replaceAll('%7D', '}').replaceAll('%2F', '/').replaceAll('%3D', '=').replaceAll('%3B', ';').replaceAll('%26', '&').replaceAll('%3F', '?').replaceAll('+', ' ');
        });
        function devTypeSlow(nav = navigator) {
            var device = "Unknown";
            var type1 = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(nav.userAgent) ? 'Mobile' : 'PC';
            device = type1;
            if (nav.userAgent.indexOf('Nintendo') != -1 || nav.userAgent.indexOf('Xbox') != -1) device = "Console";
            if (nav.userAgent.indexOf('VR') != -1) device = "VR";
            if (nav.userAgent.indexOf('PlayStation') != -1) device = "PlayStation";
            if (nav.userAgent.indexOf('Nintendo Switch') != -1) device = "Nintendo Switch";
            if (nav.userAgent.indexOf('Xbox One') != -1) device = "Xbox One";
            if (nav.userAgent.indexOf('Xbox Series X') != -1) device = "Xbox Series X";
            if (nav.userAgent.indexOf('Xbox Series S') != -1) device = "Xbox Series S";
            if (type1 === "PC" && device == type1)  {
                try {
                    var battery = false;
                    nav.getBattery().then((b)=>{battery = b});
                    Math.random() * Math.random();
                    device = (battery.charging && battery.chargingTime === 0 && battery.level === 1) ? "Desktop" : "Laptop";
                }catch(e){}
            }
            if (type1 === "Mobile") {
                if(/(ipad|tablet|(android(?!.*mobile))|(windows(?!.*phone)(.*touch))|kindle|playbook|silk|(puffin(?!.*(IP|AP|WP))))/.test(nav.userAgent.toLowerCase())) device = "Tablet";
                if (nav.userAgent.indexOf('TV') != -1) device = "TV";
                if (nav.userAgent.indexOf('Watch') != -1 || nav.userAgent.indexOf('Wear') != -1) device = "Watch";
            }
            return device;
        }
        document.querySelector('form.auth').innerHTML += `<input class="hided" name="deviceType" value="${devTypeSlow()}">`;
        if (vars["redirect"]) {
            document.querySelector('#redirect-link').setAttribute('value', vars["redirect"]);
        } else {
            if (!!window.opener) {
                document.querySelector('.backButton').classList.add('hided');
                document.querySelector('#redirect-link').setAttribute('value', '#saveToTokenVariable:WinOpen');
            } else {
                window.history.back();
            }
        }
        if (vars["ra"] == "true") {
            if (!!window.opener) document.querySelector('.backButton').setAttribute('onclick', 'window.close()');
            if (!window.opener) {
                alert("For admin access, this window has to be opened as a popup!");
                document.close();
                document.write("");
            }
            document.querySelector('form.auth.popup').classList.add('relevant');
            document.querySelector('form.auth.popup > div > h1').innerHTML = "Authorize";
            document.querySelector('form.auth.popup > div > p').innerHTML = "Login with ADMIN access to your account!";
            document.querySelector('form.auth.popup > div > button[type=submit]').innerHTML = "Elevate";
            document.querySelector('form.auth.popup').innerHTML += '<input type="text" name="ra" value="true" class="hided">';
        }
        function checkOTP() {
            fetch('/api/misc/hasotp', {method: "POST", body: JSON.stringify({accusrname: document.querySelector('input[name=accusrname]').value})}).then(r=>r.text()).then(r=>{
                if (r === "OK") {
                    document.querySelectorAll('form.auth.sections > div')[0].classList.add('hided');
                    document.querySelectorAll('form.auth.sections > div')[1].classList.remove('hided');
                    document.querySelector('form.auth.popup input[name=otpcode]').setAttribute('required', '');
                } else {
                    document.querySelector('form.auth.sections button[type=submit]').click();
                }
            })
        }
        document.querySelectorAll('p.center-text a').forEach(e=>{e.href = e.href + window.location.search});
        if (!!localStorage['Auth System-accessToken'] && vars["ra"] != "true") fetch('/api/restoresession', {method: 'POST', body: JSON.stringify({
            token: localStorage['Auth System-accessToken'] ?? window.accesstoken,
            response: 1
        })}).then(r=>r.text()).then(r=>{
            if (r!="NOT" && vars["ra"] != "true") location.href = vars["redirect"] + '?token='+localStorage['Auth System-accessToken'];
        });
        setInterval(()=>{if (!!window.submitted) {
            document.querySelector('input[name=otpcode]').value = '';
            document.querySelectorAll('form.auth.sections > div')[0].classList.remove('hided');
            document.querySelectorAll('form.auth.sections > div')[1].classList.add('hided');
            window.submitted = false;
        }}, 500)
    </script>
    <?nodejs echo(loadFile('./HTML/assets/modules/common.html', 'utf8')+""); ?>
</body>
</html>

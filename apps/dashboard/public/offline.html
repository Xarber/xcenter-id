<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Offline · X-Center ID</title>
  <style>
    :root { color-scheme: light dark; font: 1rem/1.5 system-ui, sans-serif; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 29rem); padding: 2rem; }
    img { display: block; border-radius: 14px; }
    h1 { margin-block: 1rem .25rem; font-size: clamp(1.7rem, 8vw, 2.4rem); line-height: 1.1; letter-spacing: -.04em; }
    p { margin-block: .7rem 1.25rem; }
    a { display: inline-grid; place-items: center; min-height: 44px; padding-inline: 1rem; border-radius: .7rem; background: #2b4da9; color: #fff; font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 2px solid CanvasText; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/authnjs-icon.svg" width="48" height="48" alt="X-Center ID">
    <h1>You’re offline</h1>
    <p>Reconnect to open this page and access your X-Center ID account.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>

limit_req_zone $binary_remote_addr zone=xcenter_id_per_ip:10m rate=8r/s;

server {
    listen 80;
    server_name id.xcenter.it;
    return 308 https://id.xcenter.it$request_uri;
}

server {
    listen 443 ssl;
    server_name id.xcenter.it;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/xcenter-id-error.log crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 3m;

    location / {
        limit_req zone=xcenter_id_per_ip burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18793;
        proxy_http_version 1.1;
        proxy_set_header Host id.xcenter.it;
        proxy_set_header X-Forwarded-Host id.xcenter.it;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 25s;
    }
}
